    <title>Recalls</title>
    <meta name="apple-mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="style.css">
    <style>
      .section-title {
        max-width: 1200px;
        margin: 48px auto 20px;
        padding: 0 16px;
        text-align: center;
      }
      .container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 32px 24px;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 16px;
      }
      .car-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .car-item .logo-container {
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 4px;
      }
      .car-item .logo-container {
        width: 100%;
        overflow: visible;
      }
      .car-item .logo-container img {
        width: auto !important;
        height: auto !important;
        max-height: 60px;
        max-width: 120px;
        object-fit: contain;
        display: block;
      }
      .car-item a {
        width: 100%;
        display: flex;
        justify-content: center;
        text-decoration: none;
      }
      .car-item button {
        white-space: nowrap;
        min-width: 170px;
        margin: 0;
        text-transform: none;
        -webkit-appearance: none;
        appearance: none;
        cursor: pointer;
        touch-action: manipulation;
      }
      body {
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        -webkit-text-size-adjust: 100%;
      }

      /* Phones */
      @media (max-width: 600px) {
        h1 {
          font-size: 2rem;
          margin: 24px 0 8px;
        }
        .section-title {
          font-size: 1.3rem;
          margin: 32px auto 16px;
        }
        .container {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 28px 12px;
          padding: 0 12px;
        }
        .car-item .logo-container {
          height: 48px;
        }
        .car-item .logo-container {
          height: 56px;
        }
        .car-item .logo-container img {
          max-height: 56px;
          max-width: 110px;
        }
        .car-item button {
          min-width: 0;
          width: 100%;
          min-height: 44px;
          padding: 10px 6px;
          font-size: 15px;
          letter-spacing: 0.3px;
        }
      }
    </style>
